# Dispara os avisos AGENDADOS (a cada 5 minutos, grátis).
# Precisa de 2 "Secrets" no GitHub (Settings > Secrets and variables > Actions):
#   SITE_URL     = https://futurecriativo-crm.netlify.app   (sem barra no final)
#   CRON_SECRET  = o mesmo valor do CRON_SECRET cadastrado no Netlify
name: Avisos agendados
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o servidor
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Faltam os secrets SITE_URL / CRON_SECRET"; exit 1; fi
          curl --fail --silent --show-error --max-time 60 -X POST -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/push"
